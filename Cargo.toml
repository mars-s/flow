[package]
name = "flow"
version = "0.1.4"
edition = "2024"
description = "A calm, keyboard-first personal task manager"
license = "GPL-3.0-only"

[workspace]
members = [
    "crates/flow-core",
]
default-members = [
    ".",
    "crates/flow-core",
]
resolver = "2"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = "0.4"
dirs = "6.0"
# The egoist/zed fork is upstream main plus PR #61945 (layered scene
# rendering), which lets GPUI composite menus and tooltips above native child
# views — the browser surface's WKWebView. Drop back to upstream once the PR
# merges.
gpui = { git = "https://github.com/egoist/zed", branch = "waku-webview" }
gpui_platform = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = [
    "font-kit",
    "wayland",
    "x11",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.12"
url = "2"
uuid = { version = "1.18", features = ["v4", "serde"] }
flow-core = { path = "crates/flow-core" }
pulldown-cmark = "0.13"
regex = "1"
rust-i18n = "4"
rust-umami = "0.1.1"
smol = "2"
ropey = "=2.0.0-beta.1"
futures-lite = "2"
futures = "0.3"
nucleo-matcher = "0.3.1"
tokio = { version = "1", features = ["rt"] }
turso = "0.7.2"

# `test-support` has to stay test-only. It compiles a loop into gpui's
# `flush_effects` that draws every dirty window right there, so with the
# feature on a shipping build every notify pays a full frame the moment it
# happens instead of coalescing into the display link's next one — a panel
# resize drew once per mouse-move event rather than once per displayed frame.
[dev-dependencies]
gpui = { git = "https://github.com/egoist/zed", branch = "waku-webview", features = [
    "test-support",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
wry = { version = "0.56", features = ["devtools"] }
block2 = "0.6"
# Matches the version GPUI itself renders with, so RenderImage frames are the
# same `image` types.
image = "0.25"
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGImage",
] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "WKWebView",
    "WKSnapshotConfiguration",
] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSAccessibility",
    "NSAppearance",
    "NSApplication",
    "NSBitmapImageRep",
    "NSCell",
    "NSColor",
    "NSEvent",
    "NSGraphics",
    "NSGraphicsContext",
    "NSImage",
    "NSImageRep",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "objc2-core-graphics",
    "objc2-quartz-core",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSBundle",
    "NSData",
    "NSDictionary",
    "NSError",
    "NSFileManager",
    "NSGeometry",
    "NSKeyValueObserving",
    "NSLocale",
    "NSProcessInfo",
    "NSString",
    "NSURL",
] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationSound",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "objc2-core-graphics"] }
# PRD §6.5: the calendar glance now reads from macOS's own Calendar app
# (EventKit) rather than a Google OAuth connection — Apple Calendar already
# aggregates whatever accounts the user has configured (iCloud, Google,
# Exchange, ...), so it's a strict superset for a local-first, no-backend
# app, at the cost of being macOS-only (matches wry/WKWebView's own
# macOS-only status in this same target block).
objc2-event-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "EKCalendar",
    "EKEvent",
    "EKEventStore",
    "EKObject",
    "EKSource",
    "EKTypes",
] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Matches the version GPUI exposes through `WindowOptions::icon`.
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep debug assertions and incremental builds for app code, but do not run
# GPUI's text shaping and Taffy layout hot paths completely unoptimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# `block` 0.1.6 declares an extern static with an uninhabited type. This fork
# is the crates.io release plus the future-incompatibility fix only.
[patch.crates-io]
block = { git = "https://github.com/Dicklesworthstone/rust-block", rev = "b39ae859d1ee8e8cb5eef6a516471f1578d26b96" }
