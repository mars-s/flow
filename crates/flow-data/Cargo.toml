[package]
name = "flow-data"
version = "0.1.0"
edition = "2024"
description = "Flow's local task store — no GPUI dependency, so it's reusable by any frontend (the GPUI app today, wayfinder/tickets/migrate-to-tauri.md's Tauri backend next)"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
flow-core = { path = "../flow-core" }
futures = "0.3"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["rt"] }
turso = "0.7.2"
uuid = { version = "1.18", features = ["v4"] }

# EventKit calendar bridge (calendar.rs/eventkit.rs) — macOS-only, same
# reasoning as Flow's own root Cargo.toml: PRD §6.5 reads the user's local
# Calendar app, which has no cross-platform equivalent. Feature lists
# mirror the root Cargo.toml's own objc2-event-kit/objc2-foundation
# entries exactly, since eventkit.rs moved here unchanged and still needs
# precisely the same selectors.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
# NSColor (EKCalendar::color's return type) — objc2-event-kit's own
# "objc2-app-kit" feature pulls in the type, but not the "NSColor"
# feature that generates its actual instance methods (redComponent,
# etc.), which eventkit.rs calls directly; needs declaring here
# explicitly rather than relying on it being pulled in transitively.
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSColor",
    "objc2-core-foundation",
] }
objc2-event-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "block2",
    "objc2-app-kit",
    "EKCalendar",
    "EKCalendarItem",
    "EKEvent",
    "EKEventStore",
    "EKObject",
    "EKSource",
    "EKTypes",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSDate",
    "NSEnumerator",
    "NSError",
] }
