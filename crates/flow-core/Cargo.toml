[package]
name = "flow-core"
version = "0.1.0"
edition = "2024"
description = "Generic locale and identity infrastructure shared by Flow"
license = "GPL-3.0-only"
readme = "README.md"

[dependencies]
rust-i18n = "4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std",
    "NSArray",
    "NSLocale",
    "NSString",
] }
